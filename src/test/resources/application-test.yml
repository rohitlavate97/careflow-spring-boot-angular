spring:
  datasource:
    url: jdbc:h2:mem:careflow_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

logging:
  level:
    root: WARN
    com.careflow: DEBUG

careflow:
  storage:
    documents-dir: ./target/test-data/documents

